[project]
name = "rag-doc-assistant"
version = "1.0.0"
description = "Self-corrective RAG technical-documentation assistant (LangGraph + FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency-injection default args

[tool.black]
line-length = 100
