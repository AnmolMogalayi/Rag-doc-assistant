services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # In-container paths persist via the mounted volume below.
      LOG_JSON: "true"
    volumes:
      - ./data:/app/data
      - hf-cache:/app/.cache/huggingface
    restart: unless-stopped

  # Optional: Streamlit UI (bonus). `docker compose --profile ui up`.
  ui:
    build: .
    profiles: ["ui"]
    command: streamlit run app/ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      RAG_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hf-cache:
